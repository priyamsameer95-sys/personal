<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">RiskStac and ULI: distinct product layers</title><desc id="desc">An explanatory sequence from farm signals into an assessment output and permissioned data handoff, then lender appraisal and the lender-owned credit decision. Priyam-led assessment work is separate from national ULI infrastructure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#191714"/></marker></defs><rect width="1440" height="760" fill="#faf7f0"/><g font-family="Arial, Helvetica, sans-serif"><text x="56.0" y="42.0" font-size="17" font-weight="500" fill="#625e56" text-anchor="start">AUTHORED EXPLANATION · OCTOBER 2026</text><text x="56.0" y="98.0" font-size="42" font-weight="600" fill="#191714" text-anchor="start">RiskStac and ULI: distinct product layers</text><text x="56.0" y="145.0" font-size="22" font-weight="400" fill="#625e56" text-anchor="start">Assessment product → permissioned information handoff → lender appraisal. National infrastructure is separate.</text><rect x="56.0" y="190" width="238.4" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M64.0 193H286.4" stroke="#2657ef" stroke-width="6"/><text x="72.0" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">01</text><text x="72.0" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Farm</text><text x="72.0" y="283.4" font-size="24" font-weight="600" fill="#191714" text-anchor="start">observations</text><text x="72.0" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Parcel, weather, soil</text><text x="72.0" y="396.3" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">and vegetation</text><path d="M301.4 267.0H321.4" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="328.4" y="190" width="238.4" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M336.4 193H558.8" stroke="#ff7628" stroke-width="6"/><text x="344.4" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">02</text><text x="344.4" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Assessment</text><text x="344.4" y="283.4" font-size="24" font-weight="600" fill="#191714" text-anchor="start">output</text><text x="344.4" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Risk, freshness and</text><text x="344.4" y="396.3" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">missing data</text><path d="M573.8 267.0H593.8" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="600.8" y="190" width="238.4" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M608.8 193H831.2" stroke="#c5e875" stroke-width="6"/><text x="616.8" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">03</text><text x="616.8" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Data-access</text><text x="616.8" y="283.4" font-size="24" font-weight="600" fill="#191714" text-anchor="start">layer</text><text x="616.8" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Standard APIs / ULI</text><text x="616.8" y="396.3" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">ecosystem</text><path d="M846.2 267.0H866.2" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="873.2" y="190" width="238.4" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M881.2 193H1103.6" stroke="#f59dc6" stroke-width="6"/><text x="889.2" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">04</text><text x="889.2" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Lender</text><text x="889.2" y="283.4" font-size="24" font-weight="600" fill="#191714" text-anchor="start">appraisal</text><text x="889.2" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Credit policy +</text><text x="889.2" y="396.3" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">borrower evidence</text><path d="M1118.6 267.0H1138.6" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="1145.6" y="190" width="238.4" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M1153.6 193H1376.0" stroke="#ffe348" stroke-width="6"/><text x="1161.6" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">05</text><text x="1161.6" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Credit decision</text><text x="1161.6" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Lender-owned approval</text><text x="1161.6" y="396.3" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">and funding</text><rect x="56" y="444" width="426" height="201" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M57 454V635" stroke="#2657ef" stroke-width="4"/><text x="80.0" y="479.0" font-size="18" font-weight="500" fill="#625e56" text-anchor="start">REPORTED INPUT SCALE</text><text x="80.0" y="519.0" font-size="28" font-weight="600" fill="#191714" text-anchor="start">167 indices</text><text x="80.0" y="601.0" font-size="19" font-weight="400" fill="#625e56" text-anchor="start">Signal count is not model accuracy</text><text x="80.0" y="626.6" font-size="19" font-weight="400" fill="#625e56" text-anchor="start">or validated predictive lift.</text><rect x="504" y="444" width="426" height="201" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M505 454V635" stroke="#ff7628" stroke-width="4"/><text x="528.0" y="479.0" font-size="18" font-weight="500" fill="#625e56" text-anchor="start">REPORTED PROGRAMME REACH</text><text x="528.0" y="519.0" font-size="28" font-weight="600" fill="#191714" text-anchor="start">500K+</text><text x="528.0" y="601.0" font-size="19" font-weight="400" fill="#625e56" text-anchor="start">Source wording varies between</text><text x="528.0" y="626.6" font-size="19" font-weight="400" fill="#625e56" text-anchor="start">farmers and loans.</text><rect x="952" y="444" width="432" height="201" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M953 454V635" stroke="#c5e875" stroke-width="4"/><text x="976.0" y="479.0" font-size="18" font-weight="500" fill="#625e56" text-anchor="start">REPORTED LENDING TIME</text><text x="976.0" y="519.0" font-size="28" font-weight="600" fill="#191714" text-anchor="start">Under 30 minutes</text><text x="976.0" y="601.0" font-size="19" font-weight="400" fill="#625e56" text-anchor="start">The original timing window and</text><text x="976.0" y="626.6" font-size="19" font-weight="400" fill="#625e56" text-anchor="start">comparison baseline are unavailable.</text><path d="M56 693H1384" stroke="#ddd7cb"/><text x="56.0" y="723.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Authored layer explanation, not a deployment blueprint. Programme figures do not establish personal causal impact or risk-model</text><text x="56.0" y="747.3" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">accuracy.</text></g></svg>
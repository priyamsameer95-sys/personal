<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Lender integration: contract to reconciliation</title><desc id="desc">An authored reference integration flow, not a verified architecture of delivered lender systems. Partner contracts, authenticated requests, permissioned data, versioned payloads, status handling and reconciliation have separate responsibilities.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#191714"/></marker></defs><rect width="1440" height="760" fill="#faf7f0"/><g font-family="Arial, Helvetica, sans-serif"><text x="56.0" y="42.0" font-size="17" font-weight="500" fill="#625e56" text-anchor="start">AUTHORED EXPLANATION · OCTOBER 2026</text><text x="56.0" y="98.0" font-size="42" font-weight="600" fill="#191714" text-anchor="start">Lender integration: contract to reconciliation</text><text x="56.0" y="145.0" font-size="22" font-weight="400" fill="#625e56" text-anchor="start">Documented remit: reusable integrations and partner operations. Exact deployed controls are not established.</text><rect x="56.0" y="190" width="196.3" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M64.0 193H244.3" stroke="#2657ef" stroke-width="6"/><text x="72.0" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">01</text><text x="72.0" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Agree</text><text x="72.0" y="283.4" font-size="24" font-weight="600" fill="#191714" text-anchor="start">metadata</text><text x="72.0" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Partner contract</text><path d="M259.3 267.0H275.3" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="282.3" y="190" width="196.3" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M290.3 193H470.7" stroke="#ff7628" stroke-width="6"/><text x="298.3" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">02</text><text x="298.3" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Authenticate</text><text x="298.3" y="283.4" font-size="24" font-weight="600" fill="#191714" text-anchor="start">caller</text><text x="298.3" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Who is calling?</text><path d="M485.7 267.0H501.7" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="508.7" y="190" width="196.3" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M516.7 193H697.0" stroke="#c5e875" stroke-width="6"/><text x="524.7" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">03</text><text x="524.7" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Authorise</text><text x="524.7" y="283.4" font-size="24" font-weight="600" fill="#191714" text-anchor="start">case</text><text x="524.7" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Purpose +</text><text x="524.7" y="396.3" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">consent</text><path d="M712.0 267.0H728.0" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="735.0" y="190" width="196.3" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M743.0 193H923.3" stroke="#f59dc6" stroke-width="6"/><text x="751.0" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">04</text><text x="751.0" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Validate +</text><text x="751.0" y="283.4" font-size="24" font-weight="600" fill="#191714" text-anchor="start">route</text><text x="751.0" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Schema + version</text><path d="M938.3 267.0H954.3" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="961.3" y="190" width="196.3" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M969.3 193H1149.7" stroke="#ffe348" stroke-width="6"/><text x="977.3" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">05</text><text x="977.3" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Receive</text><text x="977.3" y="283.4" font-size="24" font-weight="600" fill="#191714" text-anchor="start">status</text><text x="977.3" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Lender response</text><path d="M1164.7 267.0H1180.7" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="1187.7" y="190" width="196.3" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M1195.7 193H1376.0" stroke="#2657ef" stroke-width="6"/><text x="1203.7" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">06</text><text x="1203.7" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Reconcile +</text><text x="1203.7" y="283.4" font-size="24" font-weight="600" fill="#191714" text-anchor="start">audit</text><text x="1203.7" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Trace outcome</text><rect x="56" y="444" width="314" height="201" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><text x="76.0" y="481.0" font-size="23" font-weight="600" fill="#191714" text-anchor="start">Identity boundary</text><text x="76.0" y="527.0" font-size="21" font-weight="400" fill="#625e56" text-anchor="start">Transport protection and</text><text x="76.0" y="555.4" font-size="21" font-weight="400" fill="#625e56" text-anchor="start">agreed caller</text><text x="76.0" y="583.7" font-size="21" font-weight="400" fill="#625e56" text-anchor="start">credentials.</text><rect x="394" y="444" width="314" height="201" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><text x="414.0" y="481.0" font-size="23" font-weight="600" fill="#191714" text-anchor="start">Data contract</text><text x="414.0" y="527.0" font-size="21" font-weight="400" fill="#625e56" text-anchor="start">Allowed fields, consent</text><text x="414.0" y="555.4" font-size="21" font-weight="400" fill="#625e56" text-anchor="start">reference, freshness and</text><text x="414.0" y="583.7" font-size="21" font-weight="400" fill="#625e56" text-anchor="start">version.</text><rect x="732" y="444" width="314" height="201" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><text x="752.0" y="481.0" font-size="23" font-weight="600" fill="#191714" text-anchor="start">Operational controls</text><text x="752.0" y="527.0" font-size="21" font-weight="400" fill="#625e56" text-anchor="start">Idempotency, retries and</text><text x="752.0" y="555.4" font-size="21" font-weight="400" fill="#625e56" text-anchor="start">verified status</text><text x="752.0" y="583.7" font-size="21" font-weight="400" fill="#625e56" text-anchor="start">callbacks.</text><rect x="1070" y="444" width="314" height="201" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><text x="1090.0" y="481.0" font-size="23" font-weight="600" fill="#191714" text-anchor="start">Decision boundary</text><text x="1090.0" y="527.0" font-size="21" font-weight="400" fill="#625e56" text-anchor="start">Lender owns appraisal</text><text x="1090.0" y="555.4" font-size="21" font-weight="400" fill="#625e56" text-anchor="start">and the final credit</text><text x="1090.0" y="583.7" font-size="21" font-weight="400" fill="#625e56" text-anchor="start">decision.</text><path d="M56 693H1384" stroke="#ddd7cb"/><text x="56.0" y="723.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Reference design controls for review with engineering and lender partners; no bank-specific protocol or compliance certification is</text><text x="56.0" y="747.3" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">claimed.</text></g></svg>
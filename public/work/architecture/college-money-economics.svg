<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Education loans: funnel to contribution</title><desc id="desc">A conceptual education-loan funnel and platform economics framework. Only the previously reported enquiry-to-application conversion is supplied; no revenue, rate or profitability measurement is invented.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#191714"/></marker></defs><rect width="1440" height="760" fill="#faf7f0"/><g font-family="Arial, Helvetica, sans-serif"><text x="56.0" y="42.0" font-size="17" font-weight="500" fill="#625e56" text-anchor="start">AUTHORED EXPLANATION · OCTOBER 2026</text><text x="56.0" y="98.0" font-size="42" font-weight="600" fill="#191714" text-anchor="start">Education loans: funnel to contribution</text><text x="56.0" y="145.0" font-size="22" font-weight="400" fill="#625e56" text-anchor="start">Reported enquiry → application: 40%. Cohort and launch-year measurement definitions are unavailable.</text><rect x="56.0" y="190" width="238.4" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M64.0 193H286.4" stroke="#2657ef" stroke-width="6"/><text x="72.0" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">01</text><text x="72.0" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Enquiry</text><text x="72.0" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Student intent</text><path d="M301.4 267.0H321.4" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="328.4" y="190" width="238.4" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M336.4 193H558.8" stroke="#ff7628" stroke-width="6"/><text x="344.4" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">02</text><text x="344.4" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Application</text><text x="344.4" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Prepare evidence</text><path d="M573.8 267.0H593.8" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="600.8" y="190" width="238.4" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M608.8 193H831.2" stroke="#c5e875" stroke-width="6"/><text x="616.8" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">03</text><text x="616.8" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Lender review</text><text x="616.8" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Appraisal stays with</text><text x="616.8" y="396.3" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">lender</text><path d="M846.2 267.0H866.2" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="873.2" y="190" width="238.4" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M881.2 193H1103.6" stroke="#f59dc6" stroke-width="6"/><text x="889.2" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">04</text><text x="889.2" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Disbursement</text><text x="889.2" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">A funded loan</text><path d="M1118.6 267.0H1138.6" stroke="#191714" stroke-width="2" marker-end="url(#arrow)"/><rect x="1145.6" y="190" width="238.4" height="154" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M1153.6 193H1376.0" stroke="#ffe348" stroke-width="6"/><text x="1161.6" y="218.0" font-size="16" font-weight="500" fill="#625e56" text-anchor="start">05</text><text x="1161.6" y="251.0" font-size="24" font-weight="600" fill="#191714" text-anchor="start">Reconciliation</text><text x="1161.6" y="372.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Confirm partner</text><text x="1161.6" y="396.3" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">payout</text><rect x="56" y="430" width="410" height="218" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M57 440V638" stroke="#2657ef" stroke-width="4"/><text x="80.0" y="465.0" font-size="18" font-weight="500" fill="#625e56" text-anchor="start">LOAN PRINCIPAL</text><text x="80.0" y="505.0" font-size="28" font-weight="600" fill="#191714" text-anchor="start">Loan value ≠ revenue</text><text x="80.0" y="604.0" font-size="19" font-weight="400" fill="#625e56" text-anchor="start">Lender-controlled funding to</text><text x="80.0" y="629.6" font-size="19" font-weight="400" fill="#625e56" text-anchor="start">borrower or permitted beneficiary.</text><rect x="490" y="430" width="894" height="218" rx="8" fill="#fffdf9" stroke="#ddd7cb"/><path d="M491 440V638" stroke="#ff7628" stroke-width="4"/><text x="514.0" y="465.0" font-size="18" font-weight="500" fill="#625e56" text-anchor="start">PLATFORM ECONOMICS · FRAMEWORK</text><text x="514.0" y="505.0" font-size="28" font-weight="600" fill="#191714" text-anchor="start">Partner revenue − variable costs = contribution</text><text x="514.0" y="604.0" font-size="19" font-weight="400" fill="#625e56" text-anchor="start">Then allocate fixed operating costs. Inputs, payout rates and measured profit are</text><text x="514.0" y="629.6" font-size="19" font-weight="400" fill="#625e56" text-anchor="start">not supplied.</text><path d="M56 693H1384" stroke="#ddd7cb"/><text x="56.0" y="723.0" font-size="18" font-weight="400" fill="#625e56" text-anchor="start">Ownership covers product, partner commercials and P&amp;L. This is an explanatory framework, not a reported financial statement.</text></g></svg>
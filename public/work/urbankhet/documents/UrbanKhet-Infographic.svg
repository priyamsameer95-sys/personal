<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2200" viewBox="0 0 1400 2200" role="img" aria-labelledby="title desc">
<title id="title">UrbanKhet: from urban farming to farm-to-city fulfilment</title>
<desc id="desc">A historical founder portfolio infographic. Urban farming origins are recorded in the 2018 company profile. The four-step supply chain and the public snapshot are from Startup Gujarat's June 2020 newsletter. Later scale and B2B buyers are founder-reported and have no specified measurement window.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#B98B34"/></marker></defs>
<style>text{font-family:'DejaVu Sans',sans-serif}</style>
<rect x="0" y="0" width="1400" height="2200" fill="#F4F0E5" rx="0"/>
<text x="80" y="65" font-size="20" fill="#183E32" font-weight="700" text-anchor="start" letter-spacing="2.3">FOUNDER CASE STUDY  /  AHMEDABAD</text>
<text x="80" y="169" font-size="88" fill="#183E32" font-weight="700" text-anchor="start">UrbanKhet</text>
<g transform="translate(1240 125)" fill="none" stroke="#183E32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 30V-1M0 6C-29 7-32-17-30-20C-10-21 1-10 0 6ZM0-1C2-20 23-25 29-22C31-3 12 3 0-1Z"/><path d="M-37 33H37"/></g>
<text x="80" y="243" font-size="44" fill="#183E32" font-weight="400" text-anchor="start">From urban growing</text><text x="80" y="298" font-size="44" fill="#183E32" font-weight="400" text-anchor="start">to farm-to-city fulfilment.</text>
<text x="80" y="351" font-size="25" fill="#183E32" font-weight="700" text-anchor="start">Founded by Priyam Sameer</text>
<text x="80" y="405" font-size="27" fill="#183E32" font-weight="400" text-anchor="start">UrbanKhet connected growers with city produce buyers,</text><text x="80" y="444" font-size="27" fill="#183E32" font-weight="400" text-anchor="start">organising farm preparation, handoffs and doorstep delivery.</text>
<path d="M80 490H1320" stroke="#BCC9BA" stroke-width="2"/>
<text x="80" y="533" font-size="19" fill="#183E32" font-weight="700" text-anchor="start" letter-spacing="1.1">2018  /  URBAN FARMING ORIGINS</text>
<text x="80" y="580" font-size="24" fill="#183E32" font-weight="400" text-anchor="start">Grow food in underused city spaces.</text><text x="80" y="615" font-size="24" fill="#183E32" font-weight="400" text-anchor="start">The early profile described urban farms.</text>
<text x="755" y="533" font-size="19" fill="#183E32" font-weight="700" text-anchor="start" letter-spacing="1.1">JUNE 2020  /  DOCUMENTED SERVICE</text>
<text x="755" y="580" font-size="24" fill="#183E32" font-weight="400" text-anchor="start">Connect existing farms with city demand.</text><text x="755" y="615" font-size="24" fill="#183E32" font-weight="400" text-anchor="start">Farm-to-home fulfilment in Ahmedabad.</text>
<path d="M680 532V626" stroke="#BCC9BA" stroke-width="2"/>
<text x="80" y="657" font-size="18" fill="#5E7065" font-weight="400" text-anchor="start">Origin: company profile. Service: Startup Gujarat newsletter, June 2020.</text>
<text x="80" y="739" font-size="37" fill="#183E32" font-weight="700" text-anchor="start">How the produce moved</text>
<text x="80" y="781" font-size="23" fill="#5E7065" font-weight="400" text-anchor="start">UrbanKhet coordinated the route · documented June 2020</text>
<circle cx="218" cy="872" r="61" fill="#DCE5D3"/>
<g transform="translate(218 866)" fill="none" stroke="#183E32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-37" y="-10" width="74" height="46" rx="3"/><path d="M-23-10V35M0-10V35M23-10V35M-37 4H37M-37 20H37"/><path d="M-20-13C-30-26-9-30-13-13M0-13C-8-38 12-32 7-13M19-13C10-26 35-33 29-13"/></g>
<text x="218" y="966" font-size="26" fill="#183E32" font-weight="700" text-anchor="middle">Farm preparation</text>
<text x="218" y="1012" font-size="23" fill="#183E32" font-weight="400" text-anchor="middle">Farmers sort, weigh</text><text x="218" y="1045" font-size="23" fill="#183E32" font-weight="400" text-anchor="middle">and pack produce</text><text x="218" y="1078" font-size="23" fill="#183E32" font-weight="400" text-anchor="middle">at the farm.</text>
<path d="M304 872H456" fill="none" stroke="#B98B34" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="540" cy="872" r="61" fill="#DCE5D3"/>
<g transform="translate(540 866)" fill="none" stroke="#183E32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 34S-27 8-27-9a27 27 0 1 1 54 0C27 8 0 34 0 34Z"/><circle cx="0" cy="-9" r="9"/><path d="M-40 35H-15M15 35H40"/></g>
<text x="540" y="966" font-size="26" fill="#183E32" font-weight="700" text-anchor="middle">City handoff</text>
<text x="540" y="1012" font-size="23" fill="#183E32" font-weight="400" text-anchor="middle">Produce arrives at</text><text x="540" y="1045" font-size="23" fill="#183E32" font-weight="400" text-anchor="middle">predefined city</text><text x="540" y="1078" font-size="23" fill="#183E32" font-weight="400" text-anchor="middle">nodal points.</text>
<path d="M626 872H778" fill="none" stroke="#B98B34" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="862" cy="872" r="61" fill="#DCE5D3"/>
<g transform="translate(862 866)" fill="none" stroke="#183E32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="-12" cy="-27" r="10"/><path d="M-26-4c0-14 28-14 28 0v16M-26-4v17M-23 11v26M-4 11v26M-26 9l17 8M2 5l9 10"/><rect x="6" y="-7" width="31" height="27" rx="2"/><path d="M21-7V3"/></g>
<text x="862" y="966" font-size="26" fill="#183E32" font-weight="700" text-anchor="middle">Assigned delivery</text>
<text x="862" y="1012" font-size="23" fill="#183E32" font-weight="400" text-anchor="middle">Delivery personnel</text><text x="862" y="1045" font-size="23" fill="#183E32" font-weight="400" text-anchor="middle">collect the produce</text><text x="862" y="1078" font-size="23" fill="#183E32" font-weight="400" text-anchor="middle">for the final leg.</text>
<path d="M948 872H1100" fill="none" stroke="#B98B34" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="1184" cy="872" r="61" fill="#DCE5D3"/>
<g transform="translate(1184 866)" fill="none" stroke="#183E32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-37-2 0-32 37-2M-27-9V33H27V-9M-8 33V7H8V33M-19-18V-33H-10V-25"/></g>
<text x="1184" y="966" font-size="26" fill="#183E32" font-weight="700" text-anchor="middle">Households</text>
<text x="1184" y="1012" font-size="23" fill="#183E32" font-weight="400" text-anchor="middle">Consumers receive</text><text x="1184" y="1045" font-size="23" fill="#183E32" font-weight="400" text-anchor="middle">fresh produce</text><text x="1184" y="1078" font-size="23" fill="#183E32" font-weight="400" text-anchor="middle">at their doorstep.</text>
<text x="80" y="1132" font-size="18" fill="#5E7065" font-weight="400" text-anchor="start">Reconstructed from the June 2020 newsletter, p08. Nodal points were handoffs.</text>
<path d="M80 1173H1320" stroke="#BCC9BA" stroke-width="2"/>
<text x="80" y="1226" font-size="33" fill="#183E32" font-weight="700" text-anchor="start">The value it aimed to create</text>
<text x="80" y="1282" font-size="20" fill="#183E32" font-weight="700" text-anchor="start" letter-spacing="1.1">FOR FARMERS</text>
<text x="80" y="1324" font-size="26" fill="#183E32" font-weight="400" text-anchor="start">Reach city demand with fewer</text><text x="80" y="1362" font-size="26" fill="#183E32" font-weight="400" text-anchor="start">handling stages and intermediaries.</text>
<text x="755" y="1282" font-size="20" fill="#183E32" font-weight="700" text-anchor="start" letter-spacing="1.1">FOR HOUSEHOLDS</text>
<text x="755" y="1324" font-size="26" fill="#183E32" font-weight="400" text-anchor="start">Get fresh produce at home,</text><text x="755" y="1362" font-size="26" fill="#183E32" font-weight="400" text-anchor="start">without a visit to the market.</text>
<text x="80" y="1410" font-size="18" fill="#5E7065" font-weight="400" text-anchor="start">Value proposition from historical source accounts; not an audited impact measure.</text>
<rect x="80" y="1454" width="1240" height="209" fill="#183E32" rx="10"/>
<text x="113" y="1498" font-size="19" fill="#F4F0E5" font-weight="700" text-anchor="start" letter-spacing="1.1">PUBLIC SNAPSHOT  /  JUNE 2020</text>
<text x="113" y="1571" font-size="48" fill="#F4F0E5" font-weight="700" text-anchor="start">8</text>
<text x="113" y="1613" font-size="24" fill="#F4F0E5" font-weight="400" text-anchor="start">farmer tie-ups</text>
<text x="511" y="1571" font-size="48" fill="#F4F0E5" font-weight="700" text-anchor="start">1,800+</text>
<text x="511" y="1613" font-size="24" fill="#F4F0E5" font-weight="400" text-anchor="start">paid customers</text>
<text x="943" y="1571" font-size="48" fill="#F4F0E5" font-weight="700" text-anchor="start">100+</text>
<text x="943" y="1613" font-size="24" fill="#F4F0E5" font-weight="400" text-anchor="start">consumers daily</text>
<text x="113" y="1644" font-size="17" fill="#DCE5D3" font-weight="400" text-anchor="start">Startup Gujarat newsletter, p08 · programme-reported historical figures</text>
<rect x="80" y="1684" width="1240" height="209" fill="#EDE1C8" rx="10"/>
<text x="113" y="1728" font-size="19" fill="#183E32" font-weight="700" text-anchor="start" letter-spacing="1.1">LATER SCALE  /  FOUNDER RECORDS</text>
<text x="113" y="1801" font-size="48" fill="#183E32" font-weight="700" text-anchor="start">3,400</text>
<text x="113" y="1843" font-size="24" fill="#183E32" font-weight="400" text-anchor="start">B2C customers</text>
<text x="594" y="1801" font-size="48" fill="#183E32" font-weight="700" text-anchor="start">3,000</text>
<text x="594" y="1843" font-size="24" fill="#183E32" font-weight="400" text-anchor="start">farmers reached</text>
<text x="113" y="1874" font-size="17" fill="#5E7065" font-weight="400" text-anchor="start">Measurement window not specified · separate from the June 2020 snapshot</text>
<g transform="translate(119 1967)" fill="none" stroke="#183E32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-33-12V32H33V-12M-39-12l8-21H31l8 21M-39-12c0 12 16 12 16 0 0 12 15 12 15 0 0 12 16 12 16 0 0 12 15 12 15 0 0 12 16 12 16 0M-19 32V9H-2V32M9 8H25V21H9Z"/></g>
<text x="190" y="1949" font-size="19" fill="#183E32" font-weight="700" text-anchor="start" letter-spacing="0.7">B2B EXPANSION  /  FOUNDER-REPORTED</text>
<text x="190" y="1993" font-size="24" fill="#183E32" font-weight="400" text-anchor="start">Later served business buyers, including Marriott, Udaan and NinjaCart.</text>
<text x="190" y="2028" font-size="18" fill="#5E7065" font-weight="400" text-anchor="start">Client names come from founder career records; public contract evidence was not located.</text>
<path d="M80 2071H1320" stroke="#BCC9BA" stroke-width="2"/>
<text x="80" y="2112" font-size="18" fill="#5E7065" font-weight="400" text-anchor="start">Sources: UrbanKhet company profile; Startup Gujarat, June 2020, p08;</text><text x="80" y="2141" font-size="18" fill="#5E7065" font-weight="400" text-anchor="start">GUSEC founder interview, 3 June 2020; founder career records for later scale and B2B buyers.</text><text x="80" y="2170" font-size="18" fill="#5E7065" font-weight="400" text-anchor="start">Historical founder portfolio · Collated 13 October 2026 · Original diagram</text>
</svg>
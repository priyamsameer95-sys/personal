<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" role="img" aria-labelledby="title desc">
<title id="title">Crop-health journey: delivered flow and intended extension</title>
<desc id="desc">The delivered journey captures a leaf photograph offline, compresses and synchronises it after reconnection, then returns diagnosis. Playbooks and conversational advice are a separate intended extension, with production release unconfirmed.</desc>
<rect width="520" height="620" fill="#faf7f0"/>
<g font-family="Arial, sans-serif" fill="#191714">
<text x="28" y="35" font-size="17" letter-spacing="1">HISTORICAL DELIVERY</text>
<text x="28" y="77" font-size="30">Capture offline.</text><text x="28" y="114" font-size="30">Diagnose after reconnection.</text>
<path d="M28 140H492" stroke="#ddd7cb"/>
<g fill="none" stroke="#2657ef" stroke-width="3"><path d="M47 178v48m-6-8 6 8 6-8M47 272v48m-6-8 6 8 6-8"/></g>
<circle cx="47" cy="166" r="6" fill="#2657ef"/><circle cx="47" cy="260" r="6" fill="#2657ef"/><circle cx="47" cy="354" r="6" fill="#2657ef"/>
<g font-size="25"><text x="77" y="173">Photograph a leaf</text><text x="77" y="267">Compress and sync</text><text x="77" y="361">Return diagnosis</text></g>
<g font-size="20" fill="#625e56"><text x="77" y="204">Capture without a connection.</text><text x="77" y="298">Send after reconnection.</text><text x="77" y="392">Make the result available.</text></g>
<rect x="28" y="433" width="464" height="137" rx="4" fill="#f1ede4" stroke="#a9a295" stroke-dasharray="7 5"/>
<text x="47" y="464" font-size="18">INTENDED EXTENSION</text>
<text x="47" y="497" font-size="23">Playbooks + conversational advice</text>
<text x="47" y="528" font-size="20" fill="#625e56">Production release unconfirmed.</text>
<text x="28" y="605" font-size="17" fill="#625e56">Journey reconstruction, not a product screen.</text>
</g></svg>

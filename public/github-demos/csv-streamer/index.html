<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; font-src 'self'; media-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
    <meta name="robots" content="noindex,nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamCSV - Highly Scalable Local Parser</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f4f9; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 600px; width: 100%; text-align: center; }
        h1 { margin-top: 0; color: #222; }
        .drop-zone { display: block; box-sizing: border-box; min-height: 44px; border: 2px dashed #007bff; padding: 2rem; border-radius: 8px; background: #f0f8ff; cursor: pointer; transition: background 0.3s; margin-bottom: 1.5rem; }

        .progress-fill { height: 100%; background: #28a745; width: 0%; transition: width 0.1s; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; cursor: pointer; display: none; margin: 0 auto; }

        #error-log { color: red; font-size: 0.9rem; text-align: left; max-height: 100px; overflow-y: auto; }

<body>
    <div class="container">
        <h1>StreamCSV</h1>
        <p>Convert a local CSV into JSON. Simple comma-separated rows; quoted fields unsupported; output is held in memory.</p>

        <label class="drop-zone" id="drop-zone" role="button" tabindex="0" aria-controls="file-input" aria-label="Choose a local CSV file">
            <span>Drag & Drop a CSV file here or click to browse</span>
            <input type="file" id="file-input" accept=".csv">
        </label>

        <button type="button" id="sample-btn" aria-describedby="sample-note">Use sample CSV</button>
        <p id="sample-note" class="sample-note">A synthetic 250-row file, processed locally.</p>

        <div class="stats" role="status" aria-live="polite" aria-atomic="true">
            <div class="stat-box">Rows: <br><strong id="row-count">0</strong></div>
            <div class="stat-box">Size: <br><strong id="size-count">0 MB</strong></div>
            <div class="stat-box">Time: <br><strong id="time-count">0.0s</strong></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

        <button id="download-btn">Download as JSON</button>
        <div id="error-log"></div>
    </div>

    <script>
const fileInput = document.getElementById('file-input');
const dropZone = document.getElementById('drop-zone');
const rowCountEl = document.getElementById('row-count');
const sizeCountEl = document.getElementById('size-count');
const timeCountEl = document.getElementById('time-count');
const progressFill = document.getElementById('progress-fill');
const downloadBtn = document.getElementById('download-btn');
const errorLog = document.getElementById('error-log');

let generatedJsonBlob = null;

fileInput.addEventListener('change', handleFile);
dropZone.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    if (!event.repeat) fileInput.click();
});
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); fileInput.files = e.dataTransfer.files; handleFile(); });
downloadBtn.addEventListener('click', downloadJson);

async function handleFile() {
    const file = fileInput.files[0];
    if (!file) return;

    downloadBtn.style.display = 'none';
    errorLog.innerHTML = '';
    generatedJsonBlob = null;

    const fileSize = file.size;
    sizeCountEl.innerText = (fileSize / (1024 * 1024)).toFixed(2) + ' MB';

    let processedBytes = 0;
    let rowCount = 0;
    const startTime = performance.now();

    const stream = file.stream();
    const reader = stream.pipeThrough(new TextDecoderStream()).getReader();

    let headers = [];
    let remainder = '';
    let isFirstChunk = true;

    // We will build the JSON string in chunks to avoid memory limits, writing to a Blob array
    const jsonChunks = ['[\n'];

    try {
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            processedBytes += new TextEncoder().encode(value).length;
            progressFill.style.width = (processedBytes / fileSize * 100) + '%';

            const chunk = remainder + value;
            const lines = chunk.split(/\r?\n/);
            remainder = lines.pop(); // Keep the last incomplete line for the next chunk

            let chunkJson = '';

            for (let i = 0; i < lines.length; i++) {
                if (lines[i].trim() === '') continue;

                // Simple CSV split (doesn't handle quotes perfectly, optimized for speed & size)
                const columns = lines[i].split(',');

                if (isFirstChunk && i === 0) {
                    headers = columns.map(h => h.trim());
                    isFirstChunk = false; // Demo correction: only the first header is a header.
                    continue;
                }

                rowCount++;
                if (rowCount % 10000 === 0) {
                    rowCountEl.innerText = rowCount.toLocaleString();
                    timeCountEl.innerText = ((performance.now() - startTime) / 1000).toFixed(1) + 's';
                }

                let obj = {};
                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j]] = columns[j] ? columns[j].trim() : null;
                }

                chunkJson += (rowCount > 1 ? ',\n' : '') + JSON.stringify(obj);
            }

            jsonChunks.push(chunkJson);
        }

        // Final line
        if (remainder.trim() !== '') {
            const columns = remainder.split(',');
            let obj = {};
            for (let j = 0; j < headers.length; j++) {
                obj[headers[j]] = columns[j] ? columns[j].trim() : null;
            }
            rowCount++;
            jsonChunks.push((rowCount > 1 ? ',\n' : '') + JSON.stringify(obj));
        }

        jsonChunks.push('\n]');

        rowCountEl.innerText = rowCount.toLocaleString();
        timeCountEl.innerText = ((performance.now() - startTime) / 1000).toFixed(1) + 's';
        progressFill.style.width = '100%';

        generatedJsonBlob = new Blob(jsonChunks, { type: 'application/json' });
        downloadBtn.style.display = 'block';
        downloadBtn.innerText = `Download JSON (${(generatedJsonBlob.size / (1024*1024)).toFixed(2)} MB)`;

    } catch (err) {
        errorLog.innerText = "Error parsing file: " + err.message;
    }
}

function downloadJson() {
    if (!generatedJsonBlob) return;
    const url = URL.createObjectURL(generatedJsonBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'data.json';
    a.click();
    URL.revokeObjectURL(url);
}

</script>
